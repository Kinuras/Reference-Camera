<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AtelierLens - Artist Camera Filter</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --panel-bg: rgba(22, 22, 28, 0.85);
            --accent: #d4af37; /* Gold accent */
            --accent-glow: rgba(212, 175, 55, 0.3);
            --text-main: #f4f4f6;
            --text-muted: #9e9ea6;
            --danger: #ff4d4d;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        /* Viewfinder Area */
        .viewfinder {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #camera-video, #canvas-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        #canvas-preview {
            z-index: 2;
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: calc(50px + var(--safe-top));
            padding-top: var(--safe-top);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 20px;
            padding-right: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
        }

        .top-btn {
            background: rgba(40, 40, 48, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .top-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .app-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        /* Composition Overlays Canvas */
        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Controls Area */
        .controls-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(11,11,14,0.95) 70%, rgba(11,11,14,0.6) 90%, transparent);
            padding-bottom: max(var(--safe-bottom), 15px);
            padding-top: 15px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        /* Slider Panel */
        .slider-panel {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: opacity 0.3s ease;
        }

        .slider-panel.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .slider-header span:last-child {
            color: var(--accent);
            font-weight: 600;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* Filter Selector Strip */
        .filter-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 20px;
            scrollbar-width: none;
        }

        .filter-strip::-webkit-scrollbar {
            display: none;
        }

        .filter-pill {
            flex: 0 0 auto;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-pill.active {
            background: var(--text-main);
            color: #000;
            border-color: var(--text-main);
            font-weight: 600;
        }

        /* Bottom Action Bar */
        .action-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 30px;
        }

        .action-icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-icon-btn:active {
            transform: scale(0.92);
        }

        .shutter-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: transparent;
            border: 4px solid var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s ease;
        }

        .shutter-btn::after {
            content: '';
            width: 58px;
            height: 58px;
            background: var(--text-main);
            border-radius: 50%;
            transition: all 0.2s;
        }

        .shutter-btn:active {
            transform: scale(0.94);
        }
        .shutter-btn:active::after {
            background: var(--accent);
        }

        /* Gallery Thumbnail */
        .gallery-thumb {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: #222;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Modals & Overlays */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: none;
            flex-direction: column;
            backdrop-filter: blur(20px);
        }

        .modal.open {
            display: flex;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(var(--safe-top) + 10px) 20px 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }

        .close-modal {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Overlay Selector Modal Content */
        .overlay-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 25px;
        }

        .overlay-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .overlay-card.active {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .overlay-card span {
            font-size: 13px;
            font-weight: 500;
        }

        /* Gallery Modal Content */
        .gallery-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            align-content: start;
        }

        .gallery-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            background: #111;
            cursor: pointer;
            position: relative;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Photo Viewer Modal */
        .viewer-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 150;
            display: none;
            flex-direction: column;
        }

        .viewer-modal.open {
            display: flex;
        }

        .viewer-image-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        .viewer-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        .viewer-footer {
            padding: 20px;
            padding-bottom: max(var(--safe-bottom), 20px);
            display: flex;
            justify-content: space-around;
            background: rgba(15,15,20,0.9);
        }

        .viewer-btn {
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
            border: none;
            padding: 12px 24px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .viewer-btn.danger {
            background: rgba(255, 77, 77, 0.2);
            color: var(--danger);
        }

        /* Flash animation */
        .flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            z-index: 50;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }
        .flash.fire {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Top Bar -->
    <div class="top-bar">
        <button class="top-btn" id="overlay-toggle-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
            <span id="active-overlay-name">Grid</span>
        </button>
        <div class="app-title">AtelierLens</div>
        <button class="top-btn" id="camera-flip-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 4v5h-.582m1.582 4a8 8 0 1 1-2.083-6.508l2.583-2.492"/></svg>
            <span>Flip</span>
        </button>
    </div>

    <!-- Viewfinder Screen -->
    <div class="viewfinder" id="viewfinder">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="canvas-preview"></canvas>
        <canvas id="overlay-canvas"></canvas>
        <div class="flash" id="flash-effect"></div>
    </div>

    <!-- Bottom Controls Area -->
    <div class="controls-area">
        <!-- Value Slider Panel -->
        <div class="slider-panel disabled" id="slider-panel">
            <div class="slider-header">
                <span>Value Steps (Posterize)</span>
                <span id="slider-val-display">5 Levels</span>
            </div>
            <input type="range" id="value-slider" min="2" max="16" value="5" step="1">
        </div>

        <!-- Filter Selection Strip -->
        <div class="filter-strip" id="filter-strip">
            <div class="filter-pill active" data-filter="normal">Normal</div>
            <div class="filter-pill" data-filter="posterize">Value Posterize</div>
            <div class="filter-pill" data-filter="rubylith">Rubylith Red</div>
            <div class="filter-pill" data-filter="grayscale">High-Contrast BW</div>
            <div class="filter-pill" data-filter="warm">Warm Studio</div>
            <div class="filter-pill" data-filter="cool">Cool Studio</div>
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
            <div style="width: 44px;"></div> <!-- Spacer -->

            <!-- Shutter Button -->
            <button class="shutter-btn" id="shutter-btn" title="Take Photo"></button>

            <!-- Gallery Thumbnail Button -->
            <div class="gallery-thumb" id="gallery-btn" title="Captured Gallery">
                <img id="gallery-thumb-img" src="" alt="" style="display:none;">
                <svg id="gallery-placeholder-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
        </div>
    </div>
</div>

<!-- Overlay Selection Modal -->
<div class="modal" id="overlay-modal">
    <div class="modal-header">
        <div class="modal-title">Composition Overlays</div>
        <button class="close-modal" id="close-overlay-modal">&times;</button>
    </div>
    <div class="overlay-grid">
        <div class="overlay-card active" data-overlay="grid">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
            <span>Grid / Rule of Thirds</span>
        </div>
        <div class="overlay-card" data-overlay="golden">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12.2h18M12.2 3v18"/></svg>
            <span>Golden Ratio</span>
        </div>
        <div class="overlay-card" data-overlay="spiral">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 12m-9 0a9 9 0 1 0 18 0 9 9 0 1 0-18 0"/><path d="M12 12m-5 0a5 5 0 1 0 10 0 5 5 0 1 0-10 0"/></svg>
            <span>Golden Spiral</span>
        </div>
        <div class="overlay-card" data-overlay="diagonals">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 3l18 18M21 3L3 21"/></svg>
            <span>Diagonal Method</span>
        </div>
        <div class="overlay-card" data-overlay="center">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg>
            <span>Center Crosshair</span>
        </div>
        <div class="overlay-card" data-overlay="none">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
            <span>None</span>
        </div>
    </div>
</div>

<!-- Gallery Modal -->
<div class="modal" id="gallery-modal">
    <div class="modal-header">
        <div class="modal-title">Saved Studies (<span id="gallery-count">0</span>)</div>
        <button class="close-modal" id="close-gallery-modal">&times;</button>
    </div>
    <div class="gallery-content" id="gallery-grid">
        <!-- Captured photos appear here -->
    </div>
</div>

<!-- Photo Detail Viewer Modal -->
<div class="viewer-modal" id="viewer-modal">
    <div class="modal-header" style="background: rgba(15,15,20,0.9);">
        <div class="modal-title">Study Preview</div>
        <button class="close-modal" id="close-viewer-modal">&times;</button>
    </div>
    <div class="viewer-image-container">
        <img id="viewer-img" src="" alt="Captured Photo">
    </div>
    <div class="viewer-footer">
        <button class="viewer-btn danger" id="delete-photo-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            Delete
        </button>
        <button class="viewer-btn" id="download-photo-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Save to Device
        </button>
    </div>
</div>

<script>
    // App State
    let currentFilter = 'normal';
    let currentOverlay = 'grid';
    let posterizeLevels = 5;
    let useFrontCamera = false;
    let mediaStream = null;
    let savedPhotos = JSON.parse(localStorage.getItem('atelier_lens_photos') || '[]');
    let viewingPhotoIndex = null;

    // DOM Elements
    const video = document.getElementById('camera-video');
    const canvasPreview = document.getElementById('canvas-preview');
    const ctx = canvasPreview.getContext('2d', { willReadFrequently: true });
    const overlayCanvas = document.getElementById('overlay-canvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const viewfinder = document.getElementById('viewfinder');
    
    const filterStrip = document.getElementById('filter-strip');
    const sliderPanel = document.getElementById('slider-panel');
    const valueSlider = document.getElementById('value-slider');
    const sliderValDisplay = document.getElementById('slider-val-display');
    const shutterBtn = document.getElementById('shutter-btn');
    const cameraFlipBtn = document.getElementById('camera-flip-btn');
    const flashEffect = document.getElementById('flash-effect');
    
    // Overlays
    const overlayToggleBtn = document.getElementById('overlay-toggle-btn');
    const activeOverlayName = document.getElementById('active-overlay-name');
    const overlayModal = document.getElementById('overlay-modal');
    const closeOverlayModal = document.getElementById('close-overlay-modal');
    const overlayCards = document.querySelectorAll('.overlay-card');

    // Gallery
    const galleryBtn = document.getElementById('gallery-btn');
    const galleryModal = document.getElementById('gallery-modal');
    const closeGalleryModal = document.getElementById('close-gallery-modal');
    const galleryGrid = document.getElementById('gallery-grid');
    const galleryThumbImg = document.getElementById('gallery-thumb-img');
    const galleryPlaceholderIcon = document.getElementById('gallery-placeholder-icon');
    const galleryCount = document.getElementById('gallery-count');

    // Viewer
    const viewerModal = document.getElementById('viewer-modal');
    const closeViewerModal = document.getElementById('close-viewer-modal');
    const viewerImg = document.getElementById('viewer-img');
    const deletePhotoBtn = document.getElementById('delete-photo-btn');
    const downloadPhotoBtn = document.getElementById('download-photo-btn');

    // Initialize Camera
    async function initCamera() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
        }
        try {
            const constraints = {
                video: {
                    facingMode: useFrontCamera ? 'user' : 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };
            mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = mediaStream;
            await video.play();
            resizeCanvas();
            requestAnimationFrame(renderLoop);
        } catch (err) {
            console.error("Camera access error:", err);
            alert("Camera access denied or unavailable. Please check device permissions.");
        }
    }

    function resizeCanvas() {
        const width = viewfinder.clientWidth;
        const height = viewfinder.clientHeight;
        canvasPreview.width = width;
        canvasPreview.height = height;
        overlayCanvas.width = width;
        overlayCanvas.height = height;
        drawOverlay();
    }

    window.addEventListener('resize', resizeCanvas);

    // Filter Logic & Pixel Processing Loop
    function renderLoop() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            const w = canvasPreview.width;
            const h = canvasPreview.height;

            // Draw current video frame to canvas
            ctx.drawImage(video, 0, 0, w, h);

            if (currentFilter !== 'normal') {
                const imageData = ctx.getImageData(0, 0, w, h);
                const data = imageData.data;

                if (currentFilter === 'rubylith') {
                    // Rubylith Red Filter (Monochrome red tonal view for painters to evaluate values)
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i+1];
                        const b = data[i+2];
                        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                        data[i] = Math.min(255, lum * 1.5);
                        data[i+1] = lum * 0.2;
                        data[i+2] = lum * 0.2;
                    }
                } else if (currentFilter === 'posterize') {
                    // Value Posterization (Reduces continuous tones into N discrete steps)
                    const steps = posterizeLevels;
                    const stepSize = 255 / (steps - 1);
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i+1];
                        const b = data[i+2];
                        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                        const quantized = Math.round(lum / stepSize) * stepSize;
                        data[i] = quantized;
                        data[i+1] = quantized;
                        data[i+2] = quantized;
                    }
                } else if (currentFilter === 'grayscale') {
                    // High-Contrast Grayscale
                    for (let i = 0; i < data.length; i += 4) {
                        let lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                        lum = lum < 128 ? lum * 0.75 : Math.min(255, lum * 1.25 + 20);
                        data[i] = lum;
                        data[i+1] = lum;
                        data[i+2] = lum;
                    }
                } else if (currentFilter === 'warm') {
                    // Warm Studio Light simulation
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = Math.min(255, data[i] * 1.15);     // Boost Red
                        data[i+1] = Math.min(255, data[i+1] * 1.05); // Boost Green slightly
                        data[i+2] = Math.max(0, data[i+2] * 0.85);   // Reduce Blue
                    }
                } else if (currentFilter === 'cool') {
                    // Cool Studio Light simulation
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = Math.max(0, data[i] * 0.85);       // Reduce Red
                        data[i+1] = Math.min(255, data[i+1] * 1.02); 
                        data[i+2] = Math.min(255, data[i+2] * 1.2);    // Boost Blue
                    }
                }

                ctx.putImageData(imageData, 0, 0);
            }
        }
        requestAnimationFrame(renderLoop);
    }

    // Composition Overlays Drawer
    function drawOverlay() {
        const w = overlayCanvas.width;
        const h = overlayCanvas.height;
        overlayCtx.clearRect(0, 0, w, h);

        if (currentOverlay === 'none') return;

        overlayCtx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        overlayCtx.lineWidth = 1;

        if (currentOverlay === 'grid') {
            const thirdW = w / 3;
            const thirdH = h / 3;
            overlayCtx.beginPath();
            overlayCtx.moveTo(thirdW, 0); overlayCtx.lineTo(thirdW, h);
            overlayCtx.moveTo(thirdW * 2, 0); overlayCtx.lineTo(thirdW * 2, h);
            overlayCtx.moveTo(0, thirdH); overlayCtx.lineTo(w, thirdH);
            overlayCtx.moveTo(0, thirdH * 2); overlayCtx.lineTo(w, thirdH * 2);
            overlayCtx.stroke();
        } else if (currentOverlay === 'golden') {
            const g1 = w * 0.382;
            const g2 = w * 0.618;
            const h1 = h * 0.382;
            const h2 = h * 0.618;
            overlayCtx.beginPath();
            overlayCtx.moveTo(g1, 0); overlayCtx.lineTo(g1, h);
            overlayCtx.moveTo(g2, 0); overlayCtx.lineTo(g2, h);
            overlayCtx.moveTo(0, h1); overlayCtx.lineTo(w, h1);
            overlayCtx.moveTo(0, h2); overlayCtx.lineTo(w, h2);
            overlayCtx.stroke();
        } else if (currentOverlay === 'spiral') {
            overlayCtx.strokeStyle = 'rgba(212, 175, 55, 0.7)';
            overlayCtx.lineWidth = 1.5;
            overlayCtx.strokeRect(0, 0, w, h);
            
            // Golden spiral approximate arc path
            overlayCtx.beginPath();
            overlayCtx.arc(w * 0.618, h * 0.5, w * 0.382, 0, Math.PI * 1.5);
            overlayCtx.stroke();
        } else if (currentOverlay === 'diagonals') {
            overlayCtx.beginPath();
            overlayCtx.moveTo(0, 0); overlayCtx.lineTo(w, h);
            overlayCtx.moveTo(w, 0); overlayCtx.lineTo(0, h);
            overlayCtx.moveTo(0, h); overlayCtx.lineTo(w / 2, 0);
            overlayCtx.moveTo(w, h); overlayCtx.lineTo(w / 2, 0);
            overlayCtx.stroke();
        } else if (currentOverlay === 'center') {
            const cx = w / 2;
            const cy = h / 2;
            overlayCtx.beginPath();
            overlayCtx.arc(cx, cy, 25, 0, Math.PI * 2);
            overlayCtx.moveTo(cx - 35, cy); overlayCtx.lineTo(cx - 10, cy);
            overlayCtx.moveTo(cx + 10, cy); overlayCtx.lineTo(cx + 35, cy);
            overlayCtx.moveTo(cx, cy - 35); overlayCtx.lineTo(cx, cy - 10);
            overlayCtx.moveTo(cx, cy + 10); overlayCtx.lineTo(cx, cy + 35);
            overlayCtx.stroke();
        }
    }

    // Event Listeners: Filter Selection
    filterStrip.addEventListener('click', (e) => {
        const pill = e.target.closest('.filter-pill');
        if (!pill) return;
        
        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.getAttribute('data-filter');

        if (currentFilter === 'posterize') {
            sliderPanel.classList.remove('disabled');
        } else {
            sliderPanel.classList.add('disabled');
        }
    });

    // Slider Event
    valueSlider.addEventListener('input', (e) => {
        posterizeLevels = parseInt(e.target.value);
        sliderValDisplay.textContent = `${posterizeLevels} Levels`;
    });

    // Camera Flip
    cameraFlipBtn.addEventListener('click', () => {
        useFrontCamera = !useFrontCamera;
        initCamera();
    });

    // Overlay Modal Management
    overlayToggleBtn.addEventListener('click', () => overlayModal.classList.add('open'));
    closeOverlayModal.addEventListener('click', () => overlayModal.classList.remove('open'));

    overlayCards.forEach(card => {
        card.addEventListener('click', () => {
            overlayCards.forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            currentOverlay = card.getAttribute('data-overlay');
            activeOverlayName.textContent = card.querySelector('span').textContent.split('/')[0].trim();
            drawOverlay();
            overlayModal.classList.remove('open');
        });
    });

    // Shutter Photo Capture
    shutterBtn.addEventListener('click', () => {
        flashEffect.classList.add('fire');
        setTimeout(() => flashEffect.classList.remove('fire'), 300);

        const captureCanvas = document.createElement('canvas');
        captureCanvas.width = canvasPreview.width;
        captureCanvas.height = canvasPreview.height;
        const capCtx = captureCanvas.getContext('2d');

        capCtx.drawImage(canvasPreview, 0, 0);

        const dataUrl = captureCanvas.toDataURL('image/jpeg', 0.90);
        savedPhotos.unshift(dataUrl);
        localStorage.setItem('atelier_lens_photos', JSON.stringify(savedPhotos));

        updateGalleryThumbnail();
    });

    // Gallery Modal Management
    galleryBtn.addEventListener('click', () => {
        renderGalleryGrid();
        galleryModal.classList.add('open');
    });
    closeGalleryModal.addEventListener('click', () => galleryModal.classList.remove('open'));

    function updateGalleryThumbnail() {
        if (savedPhotos.length > 0) {
            galleryThumbImg.src = savedPhotos[0];
            galleryThumbImg.style.display = 'block';
            galleryPlaceholderIcon.style.display = 'none';
        } else {
            galleryThumbImg.style.display = 'none';
            galleryPlaceholderIcon.style.display = 'block';
        }
    }

    function renderGalleryGrid() {
        galleryGrid.innerHTML = '';
        galleryCount.textContent = savedPhotos.length;
        savedPhotos.forEach((photoUrl, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `<img src="${photoUrl}" alt="Study">`;
            item.addEventListener('click', () => openPhotoViewer(index));
            galleryGrid.appendChild(item);
        });
    }

    // Photo Detail Viewer
    function openPhotoViewer(index) {
        viewingPhotoIndex = index;
        viewerImg.src = savedPhotos[index];
        viewerModal.classList.add('open');
    }

    closeViewerModal.addEventListener('click', () => viewerModal.classList.remove('open'));

    deletePhotoBtn.addEventListener('click', () => {
        if (viewingPhotoIndex !== null) {
            savedPhotos.splice(viewingPhotoIndex, 1);
            localStorage.setItem('atelier_lens_photos', JSON.stringify(savedPhotos));
            viewerModal.classList.remove('open');
            updateGalleryThumbnail();
            renderGalleryGrid();
            viewingPhotoIndex = null;
        }
    });

    downloadPhotoBtn.addEventListener('click', () => {
        if (viewingPhotoIndex !== null) {
            const link = document.createElement('a');
            link.download = `AtelierStudy-${Date.now()}.jpg`;
            link.href = savedPhotos[viewingPhotoIndex];
            link.click();
        }
    });

    // Initial boot
    updateGalleryThumbnail();
    initCamera();
</script>

</body>
</html>
